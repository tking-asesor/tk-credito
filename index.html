<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Gestor Pro · Simulador Inteligente</title>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET Y VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }
        :root {
            --bg: #f2f6fa;
            --card-bg: #ffffff;
            --text: #0a2a33;
            --text-light: #3a5a6a;
            --primary: #0f6f85;
            --primary-dark: #0a4b5c;
            --primary-light: #d4eaf0;
            --border: #dce6ec;
            --shadow: 0 8px 30px rgba(0, 40, 60, 0.08);
            --radius: 24px;
            --radius-sm: 16px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            max-width: 560px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 18px 30px;
            transition: background 0.3s;
        }
        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border);
        }
        .logo-placeholder {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            flex-shrink: 0;
        }
        .logo-img {
            height: 48px;
            width: auto;
            object-fit: contain;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }
        .header h1 small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-light);
        }
        .theme-toggle {
            margin-left: auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
        }
        .theme-toggle:hover {
            background: var(--primary-light);
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 3px;
            letter-spacing: 0.3px;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            transition: var(--transition);
            color: var(--text);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 111, 133, 0.12);
            background: var(--card-bg);
        }
        select.form-control {
            appearance: auto;
            cursor: pointer;
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            padding-top: 4px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(15, 111, 133, 0.25);
        }
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--border);
        }
        .btn-success {
            background: #1e7b4a;
            color: #fff;
        }
        .btn-success:hover {
            background: #14633a;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary-light);
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .button-group .btn {
            flex: 1;
            min-width: 120px;
        }

        /* ===== STEPS ===== */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            position: relative;
        }
        .step-dot {
            flex: 1;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-light);
            position: relative;
            z-index: 2;
        }
        .step-dot .circle {
            width: 32px;
            height: 32px;
            background: var(--border);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-light);
            transition: var(--transition);
            margin-bottom: 4px;
        }
        .step-dot.active .circle {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 0 4px rgba(15, 111, 133, 0.15);
        }
        .step-dot.completed .circle {
            background: var(--primary-dark);
            color: #fff;
        }
        .step-dot.active .step-label {
            color: var(--primary);
            font-weight: 600;
        }
        .step-line {
            position: absolute;
            top: 16px;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--border);
            z-index: 1;
        }
        .form-step {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .form-step.active-step {
            display: block;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESULTADOS ===== */
        .result-card {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 16px;
            border-left: 5px solid var(--primary);
        }
        .result-card .badge {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 40px;
            margin-bottom: 6px;
        }
        .result-card h3 {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .result-card .sub {
            font-size: 13px;
            color: var(--text-light);
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .ranking-item:last-child {
            border-bottom: 0;
        }
        .ranking-item .entidad {
            font-weight: 600;
        }
        .ranking-item .prob {
            font-size: 12px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            background: #d4edda;
            color: #0b5e3a;
        }
        .prob.media {
            background: #fff3cd;
            color: #856404;
        }
        .prob.baja {
            background: #f8d7da;
            color: #721c24;
        }
        .observacion {
            background: var(--primary-light);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 13px;
            margin-top: 12px;
            color: var(--text);
        }
        .riesgo-badge {
            display: inline-block;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 13px;
        }
        .riesgo-bajo { background: #d4edda; color: #0b5e3a; }
        .riesgo-medio { background: #fff3cd; color: #856404; }
        .riesgo-alto { background: #f8d7da; color: #721c24; }

        /* ===== PANEL DE PROSPECTOS ===== */
        .panel-toggle {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 16px 0 8px;
        }
        .panel-toggle:hover {
            text-decoration: underline;
        }
        .panel-content {
            display: none;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .panel-content.open {
            display: block;
        }
        .panel-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-item .info {
            display: flex;
            flex-direction: column;
        }
        .panel-item .info .nombre {
            font-weight: 600;
        }
        .panel-item .info .detalle {
            font-size: 11px;
            color: var(--text-light);
        }
        .panel-item .badge-entidad {
            background: var(--primary);
            color: #fff;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 600;
        }
        .empty-panel {
            color: var(--text-light);
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== ALERTAS ===== */
        .alert {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }
        .alert-warning {
            background: #fef5e7;
            color: #b85d19;
            border-left: 4px solid #f59e0b;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-container { padding: 14px; }
            .row-2 { grid-template-columns: 1fr; }
            .row-3 { grid-template-columns: 1fr 1fr; }
            .header h1 { font-size: 17px; }
            .btn { font-size: 14px; padding: 11px 16px; }
        }
        /* ===== SCROLL ===== */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 8px; }

        /* ===== MODO OSCURO (toggle) ===== */
        body.dark {
            --bg: #121e26;
            --card-bg: #1a2c36;
            --text: #e6edf2;
            --text-light: #9bb3c0;
            --border: #2a4050;
            --primary-light: #1f4050;
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        body.dark .form-control {
            background: #1f2f3a;
            color: #e6edf2;
        }
        body.dark .result-card {
            background: #1f2f3a;
        }
        body.dark .panel-item {
            background: #1f2f3a;
        }
        body.dark .observacion {
            background: #1f4050;
        }
        body.dark .btn-secondary {
            background: #1f2f3a;
            color: #e6edf2;
        }
        body.dark .btn-secondary:hover {
            background: #2a4050;
        }
        body.dark .theme-toggle {
            background: #1f2f3a;
            border-color: #2a4050;
        }
        .theme-toggle .fa-moon { display: inline; }
        .theme-toggle .fa-sun { display: none; }
        body.dark .theme-toggle .fa-moon { display: none; }
        body.dark .theme-toggle .fa-sun { display: inline; }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- HEADER -->
    <header class="header">
        <div class="logo-placeholder" id="logoContainer">
            <!-- Cambiar src por "logo.png" cuando tengas -->
            <span id="logoTxt">GP</span>
        </div>
        <h1>Gestor Pro <small>Simulador Inteligente</small></h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
            <i class="fas fa-moon"></i><i class="fas fa-sun"></i>
        </button>
    </header>

    <!-- ================================ -->
    <!-- FORMULARIO DE 3 PASOS           -->
    <!-- ================================ -->
    <form id="formProspecto" autocomplete="off">
        <!-- Paso 1: Datos personales y monto -->
        <div class="form-step active-step" id="step1">
            <div class="step-indicator">
                <div class="step-dot active"><span class="circle">1</span><div class="step-label">Datos</div></div>
                <div class="step-dot"><span class="circle">2</span><div class="step-label">Perfil</div></div>
                <div class="step-dot"><span class="circle">3</span><div class="step-label">Revisar</div></div>
                <div class="step-line"></div>
            </div>

            <div class="form-group">
                <label>Monto a solicitar (Gs.) *</label>
                <select class="form-control" id="monto">
                    <option value="1000000">1.000.000</option>
                    <option value="2000000">2.000.000</option>
                    <option value="3000000">3.000.000</option>
                    <option value="4000000">4.000.000</option>
                    <option value="5000000" selected>5.000.000</option>
                </select>
            </div>
            <div class="form-group">
                <label>Plazo (meses) *</label>
                <select class="form-control" id="plazo">
                    <option value="6">6</option>
                    <option value="10">10</option>
                    <option value="12">12</option>
                    <option value="15">15</option>
                    <option value="18">18</option>
                    <option value="24" selected>24</option>
                </select>
            </div>
            <div style="background:var(--primary-light); border-radius:var(--radius-sm); padding:10px; text-align:center; margin-bottom:16px;">
                <span style="font-size:12px; color:var(--text-light);">Cuota estimada Tking</span>
                <div style="font-size:22px; font-weight:800; color:var(--primary);" id="cuotaPreview">₲ 0</div>
            </div>

            <div class="row-2">
                <div class="form-group"><label>Nombres *</label><input class="form-control" type="text" id="nombres" placeholder="Juan" required></div>
                <div class="form-group"><label>Apellidos *</label><input class="form-control" type="text" id="apellidos" placeholder="Pérez" required></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Cédula *</label><input class="form-control" type="text" id="cedula" placeholder="1.234.567" required></div>
                <div class="form-group"><label>WhatsApp *</label><input class="form-control" type="tel" id="celular" placeholder="0991.123.456" required></div>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Fecha de Nacimiento *</label><input class="form-control" type="date" id="fechaNac" required></div>
                <div class="form-group"><label>Ciudad / Depto *</label>
                    <select class="form-control" id="ciudad">
                        <option value="">Seleccionar</option>
                        <option value="Asunción">Asunción</option>
                        <option value="Central">Central</option>
                        <option value="Alto Paraná">Alto Paraná</option>
                        <option value="San Pedro">San Pedro</option>
                        <option value="Itapúa">Itapúa</option>
                        <option value="Misiones">Misiones</option>
                        <option value="Paraguarí">Paraguarí</option>
                        <option value="Cordillera">Cordillera</option>
                        <option value="Guairá">Guairá</option>
                        <option value="Concepción">Concepción</option>
                        <option value="Ñeembucú">Ñeembucú</option>
                        <option value="Caazapá">Caazapá</option>
                        <option value="Pdte. Hayes">Pdte. Hayes</option>
                        <option value="Canindeyú">Canindeyú</option>
                        <option value="Amambay">Amambay</option>
                        <option value="Boquerón">Boquerón</option>
                        <option value="Alto Paraguay">Alto Paraguay</option>
                    </select>
                </div>
            </div>
            <div class="alert alert-error" id="errorStep1"></div>
            <button type="button" class="btn btn-primary" onclick="nextStep(2)">Continuar →</button>
        </div>

        <!-- Paso 2: Perfil laboral y extras -->
        <div class="form-step" id="step2">
            <div class="step-indicator">
                <div class="step-dot completed"><span class="circle">1</span><div class="step-label">Datos</div></div>
                <div class="step-dot active"><span class="circle">2</span><div class="step-label">Perfil</div></div>
                <div class="step-dot"><span class="circle">3</span><div class="step-label">Revisar</div></div>
                <div class="step-line"></div>
            </div>

            <div class="form-group">
                <label>Actividad Laboral *</label>
                <select class="form-control" id="actividad" required>
                    <option value="">Seleccionar...</option>
                    <option value="empleado_privado">Empleado privado</option>
                    <option value="funcionario_permanente">Función Pública PERMANENTE</option>
                    <option value="funcionario_contratado">Función Pública CONTRATADO</option>
                    <option value="jubilado">JUBILADO</option>
                    <option value="independiente">INDEPENDIENTE</option>
                    <option value="comerciante">COMERCIANTE</option>
                </select>
            </div>
            <div class="row-2">
                <div class="form-group"><label>Antigüedad (años)</label><input class="form-control" type="number" id="antiguedad" placeholder="3" min="0" step="0.5"></div>
                <div class="form-group"><label>Ingreso mensual (Gs.) *</label><input class="form-control" type="number" id="ingreso" placeholder="2.900.000" required></div>
            </div>
            <div class="checkbox-group">
                <label><input type="checkbox" id="ips"> Aporta IPS</label>
                <label><input type="checkbox" id="iva"> Declara IVA</label>
                <label><input type="checkbox" id="patente"> Tiene Patente</label>
                <label><input type="checkbox" id="informconf"> Tiene Informconf</label>
            </div>
            <div class="form-group">
                <label>¿Tiene otros descuentos activos?</label>
                <select class="form-control" id="descuentos">
                    <option value="ninguno">Ninguno</option>
                    <option value="prestamo">Préstamo</option>
                    <option value="cooperativa">Cooperativa</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="varios">Varios</option>
                </select>
            </div>
            <div class="alert alert-error" id="errorStep2"></div>
            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="prevStep(1)">← Atrás</button>
                <button type="button" class="btn btn-primary" onclick="nextStep(3)">Continuar →</button>
            </div>
        </div>

        <!-- Paso 3: Resumen y envío -->
        <div class="form-step" id="step3">
            <div class="step-indicator">
                <div class="step-dot completed"><span class="circle">1</span><div class="step-label">Datos</div></div>
                <div class="step-dot completed"><span class="circle">2</span><div class="step-label">Perfil</div></div>
                <div class="step-dot active"><span class="circle">3</span><div class="step-label">Revisar</div></div>
                <div class="step-line"></div>
            </div>

            <div id="resumenContainer" style="background:var(--bg); border-radius:var(--radius-sm); padding:14px; font-size:13px; margin-bottom:12px;"></div>

            <div id="resultadoRecomendacion"></div>

            <div class="alert alert-success" id="successMsg" style="display:none;"></div>
            <div class="alert alert-error" id="errorStep3"></div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="prevStep(2)">← Atrás</button>
                <button type="button" class="btn btn-success" id="btnEnviar">📩 Enviar y ver en WhatsApp</button>
            </div>
        </div>
    </form>

    <!-- ================================ -->
    <!-- PANEL DE PROSPECTOS GUARDADOS    -->
    <!-- ================================ -->
    <button class="panel-toggle" id="panelToggle"><i class="fas fa-history"></i> Ver últimos prospectos</button>
    <div class="panel-content" id="panelContent">
        <div id="panelList"></div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast">✅ Guardado</div>
</div>

<script>
    // ================================================================
    //  1. CONFIGURACIÓN
    // ================================================================
    const WHATSAPP_NUMBER = '595992271485'; // Tu número

    // Tabla de cuotas Tking (base)
    const cuotasTking = {
        1000000: {6:235000, 10:150000, 12:127000, 15:112000, 18:101000, 24:90000},
        2000000: {6:465000, 10:292500, 12:254000, 15:223000, 18:201000, 24:177000},
        3000000: {6:685000, 10:435000, 12:380000, 15:334000, 18:302000, 24:266000},
        4000000: {6:900000, 10:571000, 12:507000, 15:445000, 18:402000, 24:354000},
        5000000: {6:1150000, 10:712000, 12:633000, 15:555000, 18:503000, 24:443000}
    };

    // Cuotas de otros bancos (referenciales)

    // ================================================================
    //  2. FUNCIONES AUXILIARES
    // ================================================================
    function calcularEdad(fechaNac) {
        if (!fechaNac) return 0;
        const hoy = new Date();
        const nac = new Date(fechaNac);
        let edad = hoy.getFullYear() - nac.getFullYear();
        const m = hoy.getMonth() - nac.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
        return edad;
    }

    function obtenerCuota(tabla, monto, plazo) {
        if (!tabla) return null;
        const fila = tabla[monto];
        if (!fila) return null;
        return fila[plazo] || null;
    }

    function formatearNumero(n) {
        return n ? n.toLocaleString('es-PY') : '0';
    }

    function mostrarToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ================================================================
    //  3. MOTOR DE DECISIÓN
    // ================================================================
    function evaluarBanco(banco, datos) {
        // datos: { edad, actividad, ingreso, antiguedad, informconf, ciudad, monto, plazo, ips, iva, patente }
        const b = banco;
        // Perfil aceptado
        if (!b.perfiles.includes(datos.actividad)) return null;
        // Edad
        if (datos.edad < b.edadMin || datos.edad > b.edadMax) return null;
        // Ingreso
        if (datos.ingreso < b.ingresoMin) return null;
        // Antigüedad (si aplica)
        if (datos.antiguedad < b.antiguedadMin) return null;
        // Informconf: si no permite y tiene informconf, rechazar
        if (!b.informconfPermitido && datos.informconf) return null;
        // Ciudad: si no es 'todas' y la ciudad no está en la lista
        if (b.ciudades[0] !== 'todas' && !b.ciudades.includes(datos.ciudad)) return null;
        // Monto máximo (por ahora 5mm para todos)
        if (datos.monto > 5000000) return null;

        // Casos especiales: para Tking, si es independiente/comerciante sin iva ni patente, solo hasta 2mm (según observaciones)
        if (banco === bancos.tking) {
            if ((datos.actividad === 'independiente' || datos.actividad === 'comerciante') && !datos.iva && !datos.patente) {
                if (datos.monto > 2000000) return null;
            }
        }

        // Si llegamos aquí, el banco acepta
        // Calcular cuota
        let cuota = null;
        if (b.cuotas) {
            cuota = obtenerCuota(b.cuotas, datos.monto, datos.plazo);
        }
        // Si no tiene cuota (Capital), estimar con una tasa similar a Tking
        if (!cuota && b.nombre === 'Capital Créditos') {
            // Estimación: cuota Tking * 1.05 (5% más cara)
            const cuotaTk = obtenerCuota(cuotasTking, datos.monto, datos.plazo);
            if (cuotaTk) cuota = Math.round(cuotaTk * 1.05);
        }
        // Si aún no hay cuota, usar una estimación genérica (monto/plazo + interés 2.5% mensual)
        if (!cuota) {
            const interes = 0.025;
            const n = datos.plazo;
            const factor = (interes * Math.pow(1 + interes, n)) / (Math.pow(1 + interes, n) - 1);
            cuota = Math.round(datos.monto * factor);
        }

        return {
            nombre: b.nombre,
            cuota: cuota,
            prioridad: b.prioridad
        };
    }

    function recomendar(datos) {
        // datos: { edad, actividad, ingreso, antiguedad, informconf, ciudad, monto, plazo, ips, iva, patente }
        const resultados = [];

        // 1. Evaluar Tking (prioridad 1)
        const tkingResult = evaluarBanco(bancos.tking, datos);
        if (tkingResult) {
            resultados.push(tkingResult);
            // Si Tking acepta, NO evaluamos los demás (porque es mejor comisión)
            // Pero por si acaso, igual evaluamos pero no mostramos
            return resultados; // Solo Tking
        }

        // 2. Si Tking no acepta, evaluar los demás en orden de prioridad
        const orden = [bancos.solar, bancos.tu_financiera, bancos.paraguaya_japonesa, bancos.capital];
        for (const banco of orden) {
            const res = evaluarBanco(banco, datos);
            if (res) {
                resultados.push(res);
            }
        }
        return resultados;
    }

    // ================================================================
    //  4. MANEJO DEL FORMULARIO Y PASOS
    // ================================================================
    let currentStep = 1;

    function nextStep(step) {
        if (step === 2 && !validateStep1()) return;
        if (step === 3 && !validateStep2()) return;

        document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active-step'));
        document.getElementById('step' + step).classList.add('active-step');

        // Actualizar indicadores
        document.querySelectorAll('.step-dot').forEach((dot, idx) => {
            const num = idx + 1;
            dot.classList.remove('active', 'completed');
            if (num === step) dot.classList.add('active');
            else if (num < step) dot.classList.add('completed');
        });

        currentStep = step;
        if (step === 3) generarResumenYRecomendacion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevStep(step) {
        nextStep(step);
    }

    function validateStep1() {
        const err = document.getElementById('errorStep1');
        err.style.display = 'none';
        const nombre = document.getElementById('nombres').value.trim();
        const apellido = document.getElementById('apellidos').value.trim();
        const cedula = document.getElementById('cedula').value.replace(/\./g, '');
        const celular = document.getElementById('celular').value.replace(/[^0-9]/g, '');
        const fecha = document.getElementById('fechaNac').value;
        const ciudad = document.getElementById('ciudad').value;
        const monto = parseInt(document.getElementById('monto').value);
        if (nombre.length < 2) { showErrorStep(err, 'Nombre inválido.'); return false; }
        if (apellido.length < 2) { showErrorStep(err, 'Apellido inválido.'); return false; }
        if (cedula.length < 6 || cedula.length > 7) { showErrorStep(err, 'Cédula: 6 o 7 dígitos.'); return false; }
        if (celular.length !== 10 || !celular.startsWith('09')) { showErrorStep(err, 'WhatsApp: 10 dígitos, empieza con 09.'); return false; }
        if (!fecha) { showErrorStep(err, 'Fecha de nacimiento requerida.'); return false; }
        const edad = calcularEdad(fecha);
        if (edad < 18 || edad > 74) { showErrorStep(err, 'Edad entre 18 y 74 años.'); return false; }
        if (!ciudad) { showErrorStep(err, 'Selecciona una ciudad.'); return false; }
        if (monto < 1000000 || monto > 5000000) { showErrorStep(err, 'Monto entre 1 y 5 millones.'); return false; }
        return true;
    }

    function validateStep2() {
        const err = document.getElementById('errorStep2');
        err.style.display = 'none';
        const actividad = document.getElementById('actividad').value;
        const ingreso = parseInt(document.getElementById('ingreso').value);
        if (!actividad) { showErrorStep(err, 'Selecciona actividad laboral.'); return false; }
        if (isNaN(ingreso) || ingreso < 1800000) { showErrorStep(err, 'Ingreso mínimo ₲ 1.800.000.'); return false; }
        return true;
    }

    function showErrorStep(el, msg) {

        el.style.display = 'block';

    function generarResumenYRecomendacion() {
        // Recolectar datos
        const monto = parseInt(document.getElementById('monto').value);
        const plazo = parseInt(document.getElementById('plazo').value);
        const nombres = document.getElementById('nombres').value.trim();
        const apellidos = document.getElementById('apellidos').value.trim();
        const cedula = document.getElementById('cedula').value;
        const celular = document.getElementById('celular').value;
        const fecha = document.getElementById('fechaNac').value;
        const ciudad = document.getElementById('ciudad').value;
        const actividad = document.getElementById('actividad').value;
        const antiguedad = parseFloat(document.getElementById('antiguedad').value) || 0;
        const ingreso = parseInt(document.getElementById('ingreso').value) || 0;
        const ips = document.getElementById('ips').checked;
        const iva = document.getElementById('iva').checked;
        const patente = document.getElementById('patente').checked;
        const informconf = document.getElementById('informconf').checked;
        const descuentos = document.getElementById('descuentos').value;
        const edad = calcularEdad(fecha);

        const datos = { edad, actividad, ingreso, antiguedad, informconf, ciudad, monto, plazo, ips, iva, patente };

        // Obtener recomendación
        const recomendados = recomendar(datos);

        // Mostrar resumen
        const resumen = document.getElementById('resumenContainer');
        resumen.innerHTML = `
            <p><strong>${nombres} ${apellidos}</strong> · ${cedula} · ${ciudad}</p>
            <p>Edad: ${edad} años · Ingreso: ₲ ${formatearNumero(ingreso)} · Solicita: ₲ ${formatearNumero(monto)} a ${plazo} meses</p>
            <p>IPS: ${ips ? 'Sí' : 'No'} · IVA: ${iva ? 'Sí' : 'No'} · Patente: ${patente ? 'Sí' : 'No'} · Informconf: ${informconf ? 'Sí' : 'No'}</p>
        `;

        // Mostrar recomendación
        const cont = document.getElementById('resultadoRecomendacion');
        if (recomendados.length === 0) {
            cont.innerHTML = `<div class="alert alert-warning" style="display:block;">⚠️ No encontramos entidades que acepten este perfil. Contacta con un asesor.</div>`;
            return;
        }

        let html = `<div class="result-card"><span class="badge">🎯 Recomendación</span>`;
        // Si solo hay uno y es Tking, destacar
        if (recomendados.length === 1 && recomendados[0].nombre === 'Tking Credit') {
            html += `<div style="background:#d4edda; padding:8px; border-radius:12px; margin-bottom:10px; text-align:center; font-weight:600; color:#0b5e3a;">✅ Tking Credit · ¡Mejor comisión!</div>`;
        }
        recomendados.forEach((r, i) => {
            const emoji = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
            html += `
                <div class="ranking-item">
                    <span><strong>${emoji} ${r.nombre}</strong></span>
                    <span class="prob ${i === 0 ? '' : 'media'}">Cuota: ₲ ${formatearNumero(r.cuota)}</span>
                </div>
            `;
        });
        html += `</div>`;
        cont.innerHTML = html;
    }

    // ================================================================
    //  5. ENVÍO A WHATSAPP + GUARDADO LOCAL
    // ================================================================

        const celular = document.getElementById('celular').value.replace(/[^0-9]/g, '');
        const fecha = document.getElementById('fechaNac').value;
        const ciudad = document.getElementById('ciudad').value;
        const actividad = document.getElementById('actividad').value;
        const antiguedad = parseFloat(document.getElementById('antiguedad').value) || 0;
        const ingreso = parseInt(document.getElementById('ingreso').value) || 0;
        const ips = document.getElementById('ips').checked;
        const iva = document.getElementById('iva').checked;

        const informconf = document.getElementById('informconf').checked;
        const descuentos = document.getElementById('descuentos').value;
        const edad = calcularEdad(fecha);

        const datos = { edad, actividad, ingreso, antiguedad, informconf, ciudad, monto, plazo, ips, iva, patente };
        const recomendados = recomendar(datos);

        if (recomendados.length === 0) {
            showErrorStep(err, 'No hay entidades que acepten este perfil. Contacta a un asesor.');
            return;
        }

        // Construir mensaje WhatsApp
        let mensaje = `*NUEVA SIMULACIÓN GESTOR PRO*%0A%0A`;
        mensaje += `👤 *Cliente:* ${nombres} ${apellidos}%0A`;
        mensaje += `📄 *CI:* ${cedula}%0A`;
        mensaje += `📞 *WhatsApp:* ${celular}%0A`;
        mensaje += `🎂 *Edad:* ${edad} años%0A`;
        mensaje += `📍 *Ciudad:* ${ciudad}%0A`;
        mensaje += `💰 *Monto:* ₲ ${formatearNumero(monto)}%0A`;
        mensaje += `📅 *Plazo:* ${plazo} meses%0A`;
        mensaje += `💵 *Ingreso:* ₲ ${formatearNumero(ingreso)}%0A`;
        mensaje += `📊 *Perfil:* ${actividad.replace('_', ' ')}%0A`;
        mensaje += `🕒 *Antigüedad:* ${antiguedad} años%0A`;
        mensaje += `IPS: ${ips ? 'Sí' : 'No'} · IVA: ${iva ? 'Sí' : 'No'} · Patente: ${patente ? 'Sí' : 'No'}%0A`;
        mensaje += `🔍 *Informconf:* ${informconf ? 'Sí' : 'No'}%0A`;
        mensaje += `📌 *Descuentos:* ${descuentos}%0A%0A`;
        mensaje += `*🎯 Recomendación:*%0A`;
        recomendados.forEach((r, i) => {
            const emoji = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
            mensaje += `${emoji} ${r.nombre} · Cuota: ₲ ${formatearNumero(r.cuota)}%0A`;
        });
        mensaje += `%0A_Generado por Gestor Pro_`;

        // Abrir WhatsApp
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${mensaje}`, '_blank');

        // Guardar en localStorage
        const prospecto = {
            id: Date.now(),
            nombres,
            apellidos,
            cedula,
            celular,
            ciudad,
            monto,
            plazo,
            ingreso,
            recomendado: recomendados.map(r => r.nombre).join(', '),
            fecha: new Date().toLocaleString()
        };
        let historial = JSON.parse(localStorage.getItem('gestorPro_historial') || '[]');
        historial.unshift(prospecto);
        if (historial.length > 20) historial = historial.slice(0, 20);
        localStorage.setItem('gestorPro_historial', JSON.stringify(historial));

        // Mostrar éxito
        success.textContent = '✅ ¡Enviado! Revisa WhatsApp.';
        success.style.display = 'block';
        mostrarToast('Prospecto guardado');

        // Actualizar panel
        cargarPanel();

        // Resetear formulario? No, mejor dejamos que el usuario vea el resumen.
        // Opcional: botón "Nuevo" aparecerá
    });

    // ================================================================
    //  6. PANEL DE PROSPECTOS
    // ================================================================
    function cargarPanel() {
        const historial = JSON.parse(localStorage.getItem('gestorPro_historial') || '[]');
        const list = document.getElementById('panelList');
        if (historial.length === 0) {
            list.innerHTML = '<div class="empty-panel">Aún no hay prospectos guardados.</div>';
            return;
        }
        let html = '';
        historial.forEach(p => {
            html += `
                <div class="panel-item">
                    <div class="info">
                        <span class="nombre">${p.nombres} ${p.apellidos}</span>
                        <span class="detalle">${p.ciudad} · ₲ ${formatearNumero(p.monto)} · ${p.recomendado}</span>
                    </div>
                    <span class="badge-entidad">${p.fecha.split(',')[0]}</span>
                </div>
            `;
        });
        list.innerHTML = html;
    }

    document.getElementById('panelToggle').addEventListener('click', function() {
        const content = document.getElementById('panelContent');
        content.classList.toggle('open');
        if (content.classList.contains('open')) {
            cargarPanel();

    // ================================================================

    function calcularPreview() {
        const monto = parseInt(document.getElementById('monto').value);
        const plazo = parseInt(document.getElementById('plazo').value);
        const cuota = obtenerCuota(cuotasTking, monto, plazo);
        document.getElementById('cuotaPreview').textContent = cuota ? '₲ ' + cuota.toLocaleString('es-PY') : '₲ 0';
    }

    document.getElementById('monto').addEventListener('change', calcularPreview);
    document.getElementById('plazo').addEventListener('change', calcularPreview);

    // ================================================================

    // ================================================================

        document.body.classList.toggle('dark');
        localStorage.setItem('gestorPro_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });
    // Cargar tema guardado
    if (localStorage.getItem('gestorPro_theme') === 'dark') {
        document.body.classList.add('dark');
    }

    // ================================================================
    //  9. INICIALIZACIÓN
    // ================================================================
    window.addEventListener('DOMContentLoaded', function() {
        calcularPreview();
        cargarPanel();
        // Si hay un prospecto en curso (paso 3) no hacer nada

        const logoTxt = document.getElementById('logoTxt');
        logoTxt.textContent = 'GP';
        // Si existe logo.png, se mostrará. Para ello, crear un <img> y ocultar el texto.
        // Esto se hará manualmente luego.
    });

    // Exponer funciones globalmente para los onclick
    window.nextStep = nextStep;
    window.prevStep = prevStep;
